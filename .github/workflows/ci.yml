name: CI

on:
  push:
    branches: [dev, main, beta]
  pull_request:
    branches: [dev, main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun run typecheck --filter=@opencode-ai/desktop --filter=@opencode-ai/core --filter=opencode --filter=@opencode-ai/tui --filter=@opencode-ai/ui
        env:
          OPENCODE_CHANNEL: dev

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Lint
        run: bunx oxlint@latest --deny-warnings

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Electron
        working-directory: packages/desktop
        run: |
          export OPENCODE_CHANNEL=dev
          bun run prebuild
          bun run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: packages/desktop/out/
