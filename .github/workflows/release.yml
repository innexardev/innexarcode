name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        default: "dev"
        type: choice
        options:
          - dev
          - beta
          - prod

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: ${{ inputs.channel || 'dev' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build Electron
        working-directory: packages/desktop
        run: |
          bun run prebuild
          bun run build

      - name: Package (Linux)
        working-directory: packages/desktop
        run: |
          npx electron-builder --linux --config electron-builder.config.ts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.tar.gz
            packages/desktop/dist/latest-linux.yml

  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build Electron
        run: |
          bun run prebuild
          bun run build

      - name: Package (Windows - portable dir)
        run: |
          npx electron-builder --win dir --config electron-builder.config.ts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: packages/desktop/dist/win-unpacked/

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenCode ${{ env.OPENCODE_CHANNEL }} ${{ github.ref_name }}"
          files: |
            artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ env.OPENCODE_CHANNEL != 'prod' }}
