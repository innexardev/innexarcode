name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: dev

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Electron
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run build

      - name: Package (portable dir)
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} npx electron-builder --win dir --config electron-builder.config.ts

      - name: Package (NSIS installer)
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} npx electron-builder --win nsis --config electron-builder.config.ts

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: innexarcode-windows-portable
          path: packages/desktop/dist/win-unpacked/

      - name: Upload NSIS installer + latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: innexarcode-windows-installer
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/latest.yml
          if-no-files-found: warn

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-$(date -u +%Y%m%d-%H%M%S)"
          if ls packages/desktop/dist/*.exe 1>/dev/null 2>&1; then
            FILES=(packages/desktop/dist/*.exe)
            if [ -f packages/desktop/dist/latest.yml ]; then
              FILES+=(packages/desktop/dist/latest.yml)
            fi
            gh release create "$TAG" "${FILES[@]}" \
              --title "InnexarCode Dev $TAG" \
              --notes "Build automático do branch dev." \
              --prerelease
          fi
