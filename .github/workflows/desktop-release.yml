name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"
      - "packages/core/**"

env:
  OPENCODE_CHANNEL: dev

jobs:
  build-windows:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build + Package Windows
        working-directory: packages/desktop
        run: |
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run build
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run package:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.7z
            packages/desktop/dist/latest.yml
      - name: Upload portable for website
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-portable
          path: packages/desktop/dist/win-unpacked/

  deploy:
    needs: build-windows
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create .tar.gz for website
        run: |
          cd artifacts/opencode-windows-portable
          tar -czf ../opencode-desktop-win-portable.tar.gz .
      - name: Deploy to dev.innexar.app
        run: |
          echo "Build complete. Artifacts ready:"
          find artifacts -type f -name "*.exe" -o -name "*.tar.gz"
