name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"
      - "packages/core/**"

jobs:
  build-linux:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build + Package Linux
        working-directory: packages/desktop
        run: |
          OPENCODE_CHANNEL=dev bun run build
          OPENCODE_CHANNEL=dev bun run package:linux
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-linux
          path: packages/desktop/dist/*.AppImage
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-linux-deb
          path: packages/desktop/dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build + Package Windows
        working-directory: packages/desktop
        run: |
          $env:OPENCODE_CHANNEL="dev"
          bun run build
          bun run package:win
      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows
          path: packages/desktop/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build + Package macOS
        working-directory: packages/desktop
        run: |
          OPENCODE_CHANNEL=dev bun run build
          OPENCODE_CHANNEL=dev bun run package:mac
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos
          path: packages/desktop/dist/*.dmg

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to dev.innexar.app
        run: |
          echo "Release artifacts ready for manual deploy:"
          find artifacts -type f -ls
