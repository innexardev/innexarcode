name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"

env:
  OPENCODE_CHANNEL: dev

jobs:
  build-windows:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Electron
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run build

      - name: Package (dir only, no NSIS)
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} npx electron-builder --win dir --config electron-builder.config.ts

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: packages/desktop/dist/win-unpacked/

  release:
    needs: build-windows
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev Build #${{ github.run_number }}"
          files: |
            artifacts/opencode-windows/*
            artifacts/opencode-windows-portable/*
          prerelease: true
          generate_release_notes: false
