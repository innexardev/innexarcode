name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: dev

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Electron
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run build

      - name: Package (portable dir)
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} npx electron-builder --win dir --config electron-builder.config.ts

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: packages/desktop/dist/win-unpacked/
