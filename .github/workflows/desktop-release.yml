name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: dev

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          # Força instalação dos binários nativos Windows do node-pty
          bun install --cwd packages/desktop @lydell/node-pty-win32-x64

      - name: Build Electron
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} bun run build

      - name: Package (dir only, no NSIS)
        working-directory: packages/desktop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          OPENCODE_CHANNEL=${{ env.OPENCODE_CHANNEL }} npx electron-builder --win dir --config electron-builder.config.ts

      - name: Patch node-pty for Windows
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          ASAR="packages/desktop/dist/win-unpacked/resources/app.asar"
          bunx @electron/asar extract "$ASAR" /tmp/asar-fix

          # 1) Patch index.js para apontar pro binário Windows
          PTY_FILE="/tmp/asar-fix/node_modules/@lydell/node-pty/index.js"
          if [ -f "$PTY_FILE" ]; then
            sed -i 's/node-pty-linux-x64/node-pty-win32-x64/g' "$PTY_FILE"
            sed -i 's/node-pty-linux-arm64/node-pty-win32-arm64/g' "$PTY_FILE"
            echo "✅ Patched index.js"
            grep 'node-pty-win32' "$PTY_FILE" | head -2
          else
            echo "❌ File not found at $PTY_FILE"
            find /tmp/asar-fix -path "*/node-pty/index.js" 2>/dev/null | head -5
          fi

          # 2) Copiar binário .node Windows para o lugar certo
          WIN_PTY="packages/desktop/node_modules/@lydell/node-pty-win32-x64"
          ASAR_PTY_DIR="/tmp/asar-fix/node_modules/@lydell/node-pty"
          if [ -d "$WIN_PTY" ]; then
            mkdir -p "$ASAR_PTY_DIR/build/Release"
            cp "$WIN_PTY/index.js" "$ASAR_PTY_DIR/build/Release/windowsTerminal.js" 2>/dev/null || true
            find "$WIN_PTY" -name "*.node" -exec cp {} "$ASAR_PTY_DIR/build/Release/" \; 2>/dev/null || true
            # Fallback: copiar diretório inteiro
            cp -r "$WIN_PTY/build" "$ASAR_PTY_DIR/" 2>/dev/null || true
            echo "✅ Copiado node-pty-win32-x64 nativos"
            find "$ASAR_PTY_DIR/build" -name "*.node" 2>/dev/null | head -5
          else
            echo "⚠️ node-pty-win32-x64 não encontrado em $WIN_PTY"
            find packages/desktop/node_modules/@lydell -type d -maxdepth 2 2>/dev/null | head -10
          fi

          bunx @electron/asar pack /tmp/asar-fix "$ASAR"
          rm -rf /tmp/asar-fix

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: packages/desktop/dist/win-unpacked/

      - name: Deploy to server
        run: |
          VERSION=$(jq -r '.version' packages/desktop/package.json)
          DATE_TAG=$(date -u +"%Y%m%d_%H%M")
          TAG="${VERSION}-dev-${DATE_TAG}"
          FILENAME="innexarcode-dev-win-portable-${TAG}.tar.gz"
          DOWNLOAD_DIR="packages/web/dist/downloads"

          # Compactar
          mkdir -p "$DOWNLOAD_DIR"
          tar czf "/tmp/${FILENAME}" -C packages/desktop/dist/win-unpacked .

          # Upload via SCP
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 173.212.248.236 >> ~/.ssh/known_hosts 2>/dev/null

          scp -P 2222 "/tmp/${FILENAME}" root@173.212.248.236:/root/opencode-engos/packages/web/dist/downloads/
          ssh -p 2222 root@173.212.248.236 "cp /root/opencode-engos/packages/web/dist/downloads/${FILENAME} /root/opencode-engos/packages/web/dist/downloads/innexarcode-dev-win-portable-latest.tar.gz && docker restart opencode-web"
          echo "✅ Deploy automático concluído: ${FILENAME}"

  release:
    needs: build-windows
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev Build #${{ github.run_number }}"
          files: |
            artifacts/opencode-windows/*
            artifacts/opencode-windows-portable/*
          prerelease: true
          generate_release_notes: false
